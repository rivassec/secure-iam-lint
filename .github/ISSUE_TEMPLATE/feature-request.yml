name: Feature request
description: A new input format, output, family or integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: checkboxes
    id: failclosed
    attributes:
      label: Fail-closed
      options:
        - label: The proposal never turns an undecidable result into a pass.
          required: true
