# Keep dependencies + pinned GitHub Actions current so the SHA pins (enforced by zizmor)
# do not rot into stale, unpatched versions. Dependabot bumps the SHA AND rewrites the
# `# vX.Y.Z` comment, so pins stay both current and auditable.
version: 2
updates:
  # The SHA-pinned actions across every workflow (checkout, setup-node, cache, codeql,
  # scorecard, upload-artifact, osv/scorecard actions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # The DEV tree only (the shipped package is zero-dependency). Grouped so a routine
  # transitive bump is one reviewable PR, not many.
  - package-ecosystem: npm
    directory: /tools/iam-blast-radius
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
    # TypeScript 7 (the native port) ships no JS compiler API. madge's parser chain
    # (precinct -> typescript-estree -> ts-api-utils) crashes on load, which fails the
    # "No circular dependencies" gate. Stay on 5.x until that chain supports 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The ClusterFuzzLite base image (.clusterfuzzlite/Dockerfile) is digest-pinned;
  # Dependabot bumps the digest so the pin stays current instead of going stale.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
