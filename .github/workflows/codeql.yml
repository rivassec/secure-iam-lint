# CodeQL static analysis (taint/dataflow) for the shipped JS/mjs - the one class of check
# the grep gates + unit tests cannot do: it follows attacker-controlled data (policy JSON,
# filenames, Action inputs) through the code to sinks (path building, output/SARIF emission,
# regex construction) and flags injection / traversal / ReDoS. Free for public repos.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-published CodeQL query catches a latent issue even without a push.
    - cron: '27 3 * * 1'

# Least privilege at the workflow level; the analyze job elevates only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload findings to the repo's Code scanning tab
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          # security-extended adds higher-recall security queries beyond the default set.
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:javascript-typescript"
