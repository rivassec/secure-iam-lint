name: Security

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. No job here needs write; the job exit gates, not any upload.
permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint (pinned binary, checksum-verified; uses preinstalled shellcheck)
        run: |
          set -euo pipefail
          VER=1.7.12
          SHA=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          echo "${SHA}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

  zizmor:
    # Security audit of BOTH our workflows and the shipped action.yml.
    # zizmor's unpinned-uses audit is our SHA-pinning enforcement gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: zizmor (pinned binary, checksum-verified; job exit gates)
        run: |
          set -euo pipefail
          VER=1.29.0
          SHA=dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839
          curl -fsSL -o zizmor.tgz "https://github.com/zizmorcore/zizmor/releases/download/v${VER}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${SHA}  zizmor.tgz" | sha256sum -c -
          tar -xzf zizmor.tgz zizmor
          ./zizmor --persona=regular .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (pinned binary, checksum-verified; scans full git history)
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . -c .gitleaks.toml --redact --no-banner

  osv:
    # The SHIPPED package is zero-dependency, but the DEV tree (@playwright/test,
    # @stryker-mutator/core) pulls a large transitive tree. Scan every lockfile/manifest
    # for known CVEs. The job exit gates. To accept a specific advisory (e.g. a dev-only,
    # unreachable transitive), add an osv-scanner.toml [[IgnoredVulns]] entry - never widen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: OSV-Scanner (pinned binary, checksum-verified; known-CVE scan of all lockfiles)
        run: |
          set -euo pipefail
          VER=2.5.1
          SHA=f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${VER}/osv-scanner_linux_amd64"
          echo "${SHA}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --recursive .
