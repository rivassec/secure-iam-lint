# OpenSSF Scorecard: automated grade of this repo's security posture (branch protection,
# dependency pinning, least-privilege workflow permissions, release provenance, code
# scanning, etc.). Results upload to the Code scanning tab and (publish_results) feed the
# public badge - a credibility signal for a Marketplace security tool, and a check that the
# hardening in this repo (SHA pins, least-priv permissions, branch protection) is real.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '19 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result to Code scanning
      id-token: write          # publish results to the OpenSSF API for the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
