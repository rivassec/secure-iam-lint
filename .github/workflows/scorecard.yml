# OpenSSF Scorecard: automated grade of this repo's security posture (branch protection,
# dependency pinning, least-privilege workflow permissions, release provenance, code
# scanning, etc.). Results upload to the Code scanning tab and (publish_results) feed the
# public badge - a credibility signal for a Marketplace security tool, and a check that the
# hardening in this repo (SHA pins, least-priv permissions, branch protection) is real.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '19 4 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result to Code scanning
      id-token: write          # publish results to the OpenSSF API for the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
