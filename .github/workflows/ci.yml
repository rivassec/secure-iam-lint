name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/iam-blast-radius
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'   # node --test glob expansion needs >= 21
      - name: Unit + security tests
        run: node --test "tests/**/*.test.js"
      - name: Gate - no network APIs in shipped JS
        run: npm run gate:no-network
      - name: Gate - no unsafe DOM / eval in shipped JS
        run: npm run gate:no-unsafe-dom
      # The shipped CLI + Action run inside consumers' CI. They were UNGATED
      # (the greps above scope only content/tools/). These extend the
      # no-network + no-code-exec classes to cli/ + action/, allowing the
      # legitimate node: fs/path/crypto/url the CLI needs but forbidding any
      # network core module, remote import(), eval/Function, and child_process/vm.
      - name: Gate - no network APIs in shipped CLI + Action
        run: npm run gate:no-network:node
      - name: Gate - no eval / child_process / unsafe API in shipped CLI + Action
        run: npm run gate:no-unsafe:node

  csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: CSP audit - no inline styles/scripts/event-handlers in the shipped tool
        run: python3 scripts/csp_audit.py content/tools/iam-blast-radius

  # Detect whether any web-affecting file changed. e2e only runs when it did.
  # FAIL SAFE: if the base ref is unknown (first push, shallow, force-push), RUN
  # e2e rather than skip it - when unsure whether the UI changed, test it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then REF="${BASE:-}"; else REF="${BEFORE:-}"; fi
          if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$REF^{commit}" 2>/dev/null; then
            echo "e2e gate: base ref unknown -> RUN (fail safe)"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$REF" HEAD | grep -qE '^(content/tools/iam-blast-radius/|tools/iam-blast-radius/tests/e2e/|tools/iam-blast-radius/playwright\.config\.js|tools/iam-blast-radius/package\.json|\.github/workflows/ci\.yml)'; then
            echo "e2e gate: web files changed -> RUN"; echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e gate: no web changes -> SKIP"; echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  # e2e runs only when the fast jobs pass (needs) AND web files changed (if).
  # (If e2e is ever made a REQUIRED check under branch protection, add an
  # always-runs gate job so a path-skipped e2e cannot block a PR indefinitely.)
  e2e:
    needs: [test, csp, changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/iam-blast-radius
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install @playwright/test (pinned in package.json)
        run: npm install --no-audit --no-fund
      # Cache the browser BINARIES (~300-400 MB). Keyed on the dev package.json
      # (which pins the Playwright version), so a version bump re-downloads.
      # OS-level deps are apt packages on a fresh runner, so they are installed
      # every run regardless of the cache.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/iam-blast-radius/package.json') }}
      - name: Install browsers + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install OS deps only (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - name: Playwright e2e (Chromium, Firefox, WebKit)
        run: npx playwright test
