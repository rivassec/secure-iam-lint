# Publish secure-iam-lint to npm WITH provenance (SLSA build attestation via Sigstore).
#
# DORMANT until you deliberately release: it fires only on a pushed version tag
# (v*.*.*) or a manual dispatch. Nothing here runs on normal pushes/PRs.
#
# PREREQUISITES before the first real publish:
#   1. Claim the `secure-iam-lint` name on npm (or switch package.json to a scoped
#      name, e.g. @rivassec/secure-iam-lint, and set access: public below).
#   2. TRUSTED PUBLISHING (no long-lived token): on npmjs.com, configure this repo +
#      the `release` workflow as a Trusted Publisher for the package (Settings ->
#      Trusted Publishers). npm then mints a short-lived, workflow-scoped credential
#      via OIDC at publish time - there is NO reusable NPM_TOKEN to steal. (Review
#      finding C2.) The publish step below carries no NODE_AUTH_TOKEN.
#   3. Create a protected GitHub Environment named `npm` (Settings -> Environments)
#      with required reviewers, so a real publish needs manual approval (C2).
#   4. Confirm package.json `version` matches the tag you push (the guard below fails
#      the release on a mismatch, and requires a v*.*.* tag even for a manual dispatch).
#   5. First time: run via "Run workflow" with dry_run=true to see the dry-run output.
#
# `--provenance` requires `id-token: write` (OIDC) and a public repo.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run only (no publish)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Protected environment: a real publish requires the approval configured on the
    # `npm` environment (review finding C2). The dry-run path is gated the same way but
    # publishes nothing.
    environment: npm
    permissions:
      contents: read
      id-token: write   # OIDC: npm provenance AND trusted-publishing credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history: the ancestry gate needs the tag <-> main merge base

      # Stage-11 #11: bind the release to a commit that actually landed on main (and thus
      # passed the FULL CI matrix). A tag can be pushed on ANY commit; without this a build
      # that never went green could be published. Require the tagged commit to be reachable
      # from origin/main.
      - name: Verify the tagged commit is on origin/main
        # Stage-12 #3: also enforce on a non-dry-run dispatch. A workflow_dispatch on
        # a tag ref reaches the publish step (push || (dispatch && !dry_run)); without
        # this the ancestry check was push-only and a dispatch could publish an
        # off-main commit with only the npm environment's human approval as a backstop.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not reachable from origin/main (it never landed on main / passed full CI)"
            exit 1
          fi
          echo "tagged commit is on origin/main"

      # release.yml runs only on a maintainer tag push / approved dispatch, sets no
      # `cache:`, and all inputs come from the committed lockfile - no runtime cache to
      # poison (zizmor confidence: Low).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10.x, which does NOT perform the OIDC token exchange for
      # trusted publishing (a real publish then goes out unauthenticated and the
      # registry answers with a misleading 404). OIDC trusted publishing requires
      # npm >= 11.5.1; pin an exact version so the release toolchain is reproducible.
      # zizmor adhoc-packages: a global npm self-upgrade is unavoidably outside a
      # lockfile, but it is an EXACT pin (not a floating range) and installs only npm
      # itself from the public registry - accepted, reviewed exception.
      - name: Upgrade npm to a version that supports OIDC trusted publishing
        run: npm install -g npm@11.19.1 # zizmor: ignore[adhoc-packages]

      # A real publish MUST run from a v*.*.* tag whose version matches package.json -
      # this guards both a tag push AND a non-dry-run manual dispatch, so a dispatch can
      # never publish an unversioned or mismatched build (review finding C1).
      - name: Verify release runs from a matching version tag
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::a real publish must run from a v*.*.* tag (got '$GITHUB_REF_NAME')"; exit 1 ;;
          esac
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag_version) != package.json version $pkg_version"
            exit 1
          fi

      # Green-before-publish: the SAME gate set the PR CI enforces (not just the unit
      # suite + greps) must pass before anything is published (review finding C1).
      - name: Full test + security gate
        working-directory: tools/iam-blast-radius
        run: |
          npm ci --no-audit --no-fund
          node --test "tests/**/*.test.js"
          # Stage-11 #11: also run the hardened-runtime job's check (the CI matrix runs it
          # in parallel; a release must not be a strict subset of PR CI). Any path that
          # relied on eval / __proto__ mutation aborts under these flags.
          node --disallow-code-generation-from-strings --disable-proto=throw --test "tests/**/*.test.js"
          node --test "audit/**/*.test.js"
          GOLDEN_RELEASE_GATE=1 node --test audit/golden-corpus/release-gate.test.js
          # Stage-11 #11: the CSP audit job, too (no inline styles/scripts/handlers).
          # Paths are ../../-relative because this step runs in tools/iam-blast-radius.
          python3 ../../scripts/csp_audit.py ../../content/tools/iam-blast-radius
          npm run gate:no-network
          npm run gate:no-unsafe-dom
          npm run gate:no-network:node
          npm run gate:no-unsafe:node
          node audit/typecheck-ratchet.mjs
          npx madge --circular --extensions js,mjs ../../content/tools/iam-blast-radius/engine ../../cli ../../action
          # Stage-11 #9: gate on the unspoofable --check-targets exit code, not a grep
          # of the lint's snippet-bearing human output (a planted source comment could
          # otherwise forge the ` 0 missing target(s)` anchor).
          node audit/lint/lint.mjs --check-targets \
            || { echo "::error::fail-open lint reports MISSING guard target(s)"; exit 1; }
          # Stage-14 PERI-CHECK-TARGETS-NONGATING: also block a release on any NEW/
          # increased active hotspot vs the committed baseline.
          node audit/lint/lint.mjs --check-hotspots \
            || { echo "::error::fail-open lint reports NEW/INCREASED hotspot(s) vs hotspot-baseline.json"; exit 1; }

      # Machine-derive the build identity from the release commit (review finding C3 +
      # Stage-11 #10). The SINGLE source is coverage.js BUILD_SHA - version.js derives
      # its manifest buildSha from that import, and the shipped coverage/SARIF output
      # reads BUILD_SHA. Stamp the ONE source with GITHUB_SHA (no runtime build - a
      # one-shot sed), then fail closed unless NO shipped engine file still carries a
      # 'dev' buildSha and the version-coherence self-test agrees (so a torn stamp -
      # manifest stamped, output still 'dev' - can never be published).
      - name: Stamp buildSha from the release commit
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          c=content/tools/iam-blast-radius/engine/coverage.js
          grep -qE "BUILD_SHA = 'dev'" "$c" || { echo "::error::coverage.js BUILD_SHA is not 'dev' (refusing to stamp)"; exit 1; }
          sed -i "s/BUILD_SHA = 'dev'/BUILD_SHA = '${GITHUB_SHA}'/" "$c"
          # No shipped engine file may still carry a 'dev' buildSha after the stamp.
          if grep -rnE "BUILD_SHA = 'dev'|buildSha: *'dev'" content/tools/iam-blast-radius/engine; then
            echo "::error::a 'dev' buildSha survived the stamp (torn build identity)"; exit 1
          fi
          # The version-coherence self-test must agree that manifest == output == stamped.
          node -e "import('./content/tools/iam-blast-radius/engine/version.js').then(m=>{const r=m.checkVersionCoherence();const sha=m.VERSION_MANIFEST.buildSha;if(!r.ok){console.error('::error::version incoherent after stamp: '+JSON.stringify(r.mismatches));process.exit(1)}if(sha==='dev'){console.error('::error::manifest buildSha still dev');process.exit(1)}console.log('stamped+coherent buildSha='+sha)})"

      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --provenance --access public --dry-run

      # Trusted publishing: no NODE_AUTH_TOKEN - npm mints a short-lived credential via
      # OIDC (id-token: write) for the configured trusted publisher (review finding C2).
      - name: Publish to npm with provenance (trusted publishing)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public

      # Ship a CycloneDX SBOM alongside the provenance attestation. The package is
      # zero-dependency, so this is a small, verifiable record of exactly that.
      - name: Generate CycloneDX SBOM
        if: github.event_name == 'push'
        run: npm sbom --sbom-format cyclonedx > "sbom-${GITHUB_REF_NAME}.cdx.json"
      - name: Upload SBOM artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom-*.cdx.json
          retention-days: 90
