name: IAM Blast Radius
description: Scan AWS IAM policies for potential blast radius; fail closed on unknown analysis states.
author: rivassec
branding:
  icon: shield
  color: purple

# A JavaScript action (node20), not Docker or composite: no build step, no bundled
# dist, no runtime npm deps. It imports the headless scan module directly and reads
# a STRUCTURED result (it never scrapes stdout). It reads policy FILES only and
# NEVER runs Terraform, npm, shell, or any repo-provided command - untrusted PR
# policy content stays DATA, not code.
#
# Exit-code contract (carried into the consumer's CI, load-bearing):
#   0 analyzed, no findings at/above fail-on   -> action succeeds
#   1 findings at/above fail-on                -> action FAILS
#   2 usage/config error (bad/missing family, missing/empty paths, missing files)
#   3 FAIL-CLOSED could-not-analyze            -> action FAILS (must never be green)
#   4 internal invariant error                 -> action FAILS
# The action fails the check on 1, 2, 3, and 4. A fail-closed "could not analyze"
# (exit 3) MUST NEVER become a green check.
#
# The default does NOT upload SARIF: it writes a SARIF file and sets outputs.
# Consumers add github/codeql-action/upload-sarif themselves (opt-in
# security-events: write). Default required permission stays contents: read.

inputs:
  paths:
    description: Newline-separated files or globs to scan (e.g. "policies/**/*.json").
    required: true
  family:
    description: >-
      Policy family (REQUIRED; never auto-detected): identity | role-trust |
      resource | permissions-boundary | session | scp | rcp. Mixed repos run the
      action multiple times with different globs/families.
    required: true
  subject-account:
    description: AWS account id (12 digits) for account-aware checks (e.g. PassRole viability).
    required: false
  resource-arn:
    description: >-
      For family=resource: the ARN of the resource the policy is ATTACHED to (e.g.
      arn:aws:s3:::my-bucket). Required to analyze a resource policy; without it the
      resource family fails closed (RESOURCE_CONTEXT_REQUIRED, exit 3).
    required: false
  resource-type:
    description: 'For family=resource: the resource type (e.g. s3-bucket).'
    required: false
  resource-account:
    description: 'For family=resource: the owning account id, when known.'
    required: false
  partition:
    description: >-
      AWS partition (aws | aws-us-gov | aws-cn | aws-iso*). NO DEFAULT ON PURPOSE:
      an OMITTED partition is "not asserted", not 'aws'. Account ids do not encode
      partition, so a cross-partition role-viability verdict is only trustworthy
      when the caller actually vouched for the partition. Leave it unset and any
      such verdict is treated as UNKNOWN and FAILS CLOSED (exit 3); set it
      explicitly to assert the subject's partition.
    required: false
  fail-on:
    description: Minimum severity that fails the check (critical | high | medium | low | info | none).
    required: false
    default: high
  sarif-output:
    description: Path to write the SARIF 2.1.0 output file.
    required: false
    default: iam-blast-radius.sarif
  budget-ms:
    description: >-
      Per-policy wall-clock analysis budget in milliseconds (default 10000). If a
      policy's analysis overruns this budget it FAILS CLOSED (exit 3,
      RESOURCE_BUDGET_EXCEEDED) - it never reports a clean pass. A non-numeric value
      falls back to the default.
    required: false
    default: "10000"
  max-files:
    description: >-
      AGGREGATE ceiling on the NUMBER of matched files analyzed in one run (default
      1000). Complements the per-file budgets: a fork PR matching thousands of
      near-cap policy files would otherwise scale CI runtime linearly (an
      availability/cost DoS). Files are analyzed in a stable sorted order; once this
      many have been analyzed the run STOPS, emits the findings gathered so far, and
      FAILS CLOSED (exit 3, AGGREGATE_CAP_EXCEEDED) with a SARIF analyzer-state
      notification - the partial scan is NEVER reported clean. Raise it for a
      legitimately large policy set. A non-positive/non-integer value falls back to
      the default.
    required: false
    default: "1000"
  max-total-bytes:
    description: >-
      AGGREGATE ceiling on the TOTAL UTF-8 bytes analyzed across all matched files in
      one run (default 67108864, i.e. 64 MiB). Bounds cumulative parser work that the
      file-count cap alone would miss (a few giant files). When analyzing the next file
      would exceed this budget the run STOPS, emits the findings gathered so far, and
      FAILS CLOSED (exit 3, AGGREGATE_CAP_EXCEEDED) with a SARIF analyzer-state
      notification - never a clean pass. Raise it for a legitimately large policy set. A
      non-positive/non-integer value falls back to the default.
    required: false
    default: "67108864"
  max-sarif-results:
    description: >-
      DOCUMENT-level ceiling on the NUMBER of results in the aggregate SARIF (default 4500,
      below GitHub's ~5000-results-per-upload cap, over which GitHub SILENTLY drops the
      excess and Security-tab findings vanish). One run per scanned file is concatenated; if
      the total exceeds this cap the results are TRUNCATED deterministically - highest-
      severity/blocking findings and every fail-closed analyzer-state kept first - and a
      visible SARIF_OUTPUT_TRUNCATED analyzer-state is appended so the truncation is never
      silent. The exit code is UNAFFECTED (driven only by finding severity). Raise it for a
      legitimately large aggregate. A non-positive/non-integer value falls back to the default.
    required: false
    default: "4500"
  max-sarif-bytes:
    description: >-
      DOCUMENT-level ceiling on the aggregate SARIF size in UTF-8 bytes (default 9437184, i.e.
      9 MiB - a safe uncompressed proxy below GitHub's ~10 MB gzip upload cap). When the
      concatenated document would exceed this budget the results are TRUNCATED deterministically
      (highest-severity/blocking + fail-closed analyzer-states first) with a visible
      SARIF_OUTPUT_TRUNCATED analyzer-state; the exit code is UNAFFECTED. Raise it for a
      legitimately large aggregate. A non-positive/non-integer value falls back to the default.
    required: false
    default: "9437184"

outputs:
  sarif-path:
    description: Path to the generated SARIF file.
  exit-code:
    description: Aggregate IAM Blast Radius exit code (worst code across all scanned files).
  findings-count:
    description: Total number of findings emitted across all scanned files.
  blocking-findings-count:
    description: Total findings at/above the fail-on threshold across all scanned files.
  analysis-status:
    description: Aggregate analysis status - complete, partial, or failed.

runs:
  using: node20
  main: action/index.mjs
